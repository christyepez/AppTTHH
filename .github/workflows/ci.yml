name: AppTTHH CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore AppTTHH.slnx
      - name: Build
        run: dotnet build AppTTHH.slnx -c Release --no-restore
      - name: Test
        run: dotnet test AppTTHH.slnx -c Release --no-build --logger trx
      - name: Docker build
        run: docker build -t apptthh:ci .
